name: macOS smoke tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os:  [macos-14]   # 13 = Intel, 14 = Apple Silicon
        py: ["3.11"]
    runs-on: ${{ matrix.os }}
    env:
      PIP_PREFER_BINARY: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew deps (espeak-ng, libsndfile, ffmpeg)
        shell: bash
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install espeak-ng libsndfile ffmpeg || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Upgrade pip toolchain
        run: python -m pip install -U pip setuptools wheel packaging build

      # Torch su mac è CPU/MPS: nessun extra-index CUDA
      - name: Install Torch (CPU/MPS) first
        run: |
          pip install --upgrade --only-binary=:all: torch torchvision torchaudio

      - name: Install project deps with mac constraints
        shell: bash
        run: |
          if [ -f requirements.peter.txt ]; then
            pip install -r requirements.peter.txt -c constraints/constraints-mac-311.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt -c constraints/constraints-mac-311.txt
          fi
      - name: Ensure praat-parselmouth (binary wheel)
        run: |
          pip install --only-binary=:all: "praat-parselmouth==0.4.3" \
          || pip install "praat-parselmouth"

      - name: Smoke test
        run: python ci/smoke_test_mac.py
