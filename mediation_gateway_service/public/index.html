<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebRTC demo</title>
    <style>
    button {
        padding: 8px 16px;
    }

    pre {
        overflow-x: hidden;
        overflow-y: auto;
    }

    video {
        width: 100%;
    }

    .option {
        margin-bottom: 8px;
    }

    #media {
        max-width: 1280px;
    }
    </style>
</head>
<body>

<h2>Options</h2>
<div class="option">
    <input id="use-datachannel" checked="checked" type="checkbox"/>
    <label for="use-datachannel">Use datachannel</label>
    <select id="datachannel-parameters">
        <option value='{"ordered": true}'>Ordered, reliable</option>
        <option value='{"ordered": false, "maxRetransmits": 0}'>Unordered, no retransmissions</option>
        <option value='{"ordered": false, "maxPacketLifetime": 500}'>Unordered, 500ms lifetime</option>
    </select>
</div>
<div class="option">
    <input id="use-audio" checked="checked" type="checkbox"/>
    <label for="use-audio">Use audio</label>
    <select id="audio-codec">
        <option value="default" selected>Default codecs</option>
        <option value="opus/48000/2">Opus</option>
        <option value="PCMU/8000">PCMU</option>
        <option value="PCMA/8000">PCMA</option>
    </select>
    <select id="audio-transform">
        <option value="none" selected>No transform</option>
        <option value="cova-whisper">CoVA with Whisper</option>
        <option value="cova-faster-whisper">CoVA with FasterWhisper</option>
        <option value="cova-whisper-live">CoVA with WhisperLive</option>
        <option value="cova-linto">CoVA with Linto</option>
        <option value="deepspeech-stt">DeepSpeech</option>
        <option value="linto">Linto</option>
        <option value="whisper">Whisper</option>
        <option value="whisper-live">Whisper Live</option>
        <option value="gladia">Gladia</option>
    </select>
</div>
<div class="option">
    <input id="use-video" type="checkbox"/>
    <label for="use-video">Use video</label>
    <select id="video-resolution">
        <option value="" selected>Default resolution</option>
        <option value="320x240">320x240</option>
        <option value="640x480">640x480</option>
        <option value="960x540">960x540</option>
        <option value="1280x720">1280x720</option>
    </select>
    <select id="video-transform">
        <option value="none" selected>No transform</option>
        <option value="vcaa">VCAA</option>
        <option value="vcaa2kp">VCAA to Keypoints</option>
        <option value="edges">Edge detection</option>
        <option value="cartoon">Cartoon effect</option>
        <option value="face_detection">Points detection</option>
        <option value="object_detection">Object detection</option>
        <option value="rotate">Rotate</option>
        <option value="cuda">Cuda</option>
    </select>
    <select id="video-codec">
        <option value="default" selected>Default codecs</option>
        <option value="VP8/90000">VP8</option>
        <option value="H264/90000">H264</option>
    </select>
</div>
<div class="option">
    <input id="use-stun" type="checkbox"/>
    <label for="use-stun">Use STUN server</label>
</div>

<button id="start" onclick="start()">Start</button>
<button id="stop" style="display: none" onclick="stop()">Stop</button>
<button id="reverse-offer" onclick="reverse_offer()">Reverse Offer</button>

<h2>State</h2>
<p>
    ICE gathering state: <span id="ice-gathering-state"></span>
</p>
<p>
    ICE connection state: <span id="ice-connection-state"></span>
</p>
<p>
    Signaling state: <span id="signaling-state"></span>
</p>

<div id="media" style="display: block">
    <h2>Media</h2>

    <audio id="audio" autoplay="true" controls="true"></audio>
    <video id="video" autoplay="true" playsinline="true"></video>
    <canvas id="outputCanvas" width="255px" height="255px"  style="background-color:blue"></canvas>
</div>

<h2>Data channel</h2>
<pre id="data-channel" style="height: 200px;"></pre>

<h2>SDP</h2>

<h3>Offer</h3>
<pre id="offer-sdp"></pre>

<h3>Answer</h3>
<pre id="answer-sdp"></pre>

<p id="status">Initializing...</p>

<video id="webcam" autoplay playsinline width="256" height="256" style="display: none;"></video>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.js"></script>
<!--  Include Convex Hull library -->
<script src="https://cdn.jsdelivr.net/npm/convex-hull@1.0.3/index.min.js"></script>
<!-- Include math.js library for matrix operations -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.6.4/math.min.js"></script>
<script src="/vcaa/script.js"></script>
<script src="client.js"></script>
</body>
</html>
