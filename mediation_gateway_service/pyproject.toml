[tool.poetry]
name = "Mediation-Gateway-Service"
version = "0.1.0"
description = "Mediation Gateway Service"
authors = ["Vincent Bailleau <vincent.bailleau@al-enterprise.com>"]
license = "MIT"
include = ["utils/schemas/*.yaml", "utils/schemas/*.json"]

[tool.poetry.dependencies]
python = "^3.11"
marshmallow = "^3.23.1"
aiortc = "^1.9.0"
aiohttp = "^3.11.10"
pyee = "^12.1.1"
uvloop = "^0.21.0"
webrtc-service-transformers-core = { path = "../plugins/webrtc_service_transformers_core"}
schema = "^0.7.7"
pyyaml = "^6.0.2"
pypatch = "^1.0.2"

[tool.poetry.group.dev.dependencies]
setuptools = "^75.6.0"

[build-system]
requires = [
    "poetry-core>=1.0.0",
    'aiohttp>=3.8.3',
    'coverage>=5.0',
    'numpy>=1.19.0',
]
build-backend = "poetry.core.masonry.api"
